# App name
spring.application.name=ex76

# Sever port
server.port=8081

# Context path
server.servlet.context-path=/ex76

# Spring Data Source mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db7}
#spring.datasource.url=jdbc:mysql://172.18.58.220:3306/sys #WSL
spring.datasource.username=${DB_USERNAME:db7}
spring.datasource.password=${DB_PASSWORD:1234}

# Spring Data Source mariadb
#spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
#spring.datasource.url=jdbc:mariadb://localhost:3306/db7
#spring.datasource.username=db7
#spring.datasource.password=1234

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# thymeleaf
spring.thymeleaf.cache=false

# 오류 페이지에서 내부 예외와 스택 트레이스를 사용자에게 보여 주지 않는다.
server.error.include-message=never
server.error.include-stacktrace=never

# File upload setting for Servlet
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=${UPLOAD_PATH:C:/upload}
spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.max-file-size=10MB

# File upload Constant for Application
com.example.upload.path=${UPLOAD_PATH:C:/upload}
onequest.upload.path=${UPLOAD_PATH:C:/upload}

# Restart WAS(Web Application Server)
spring.devtools.livereload.enabled=true

#log level: ALL < DEBUG < INFO < WARN < ERROR < FATAL < OFF
#logging.level.org.springframework.security.web=trace
#logging.level.com.example=debug

