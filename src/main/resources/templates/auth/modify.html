<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{layout/basic::setContent(~{this::content})}">
  <th:block th:fragment="content">
    <div class="form-card card">
      <div class="eyebrow">ACCOUNT</div>
      <h1 class="section-title">내 정보 수정</h1>
      <p class="page-copy" style="margin-bottom:25px">닉네임을 바꾸거나 비밀번호를 안전하게 변경할 수 있어요.</p>

      <form th:action="@{/auth/modify}" method="post">
        <div class="field">
          <label for="email">아이디</label>
          <input class="form-control-oq" id="email" name="email" type="text"
                 th:value="${member.email}" readonly>
        </div>
        <div class="field">
          <label for="name">닉네임</label>
          <input class="form-control-oq" id="name" name="name" maxlength="30"
                 th:value="${member.name}" required>
        </div>
        <div class="field">
          <label for="currentPassword">현재 비밀번호</label>
          <input class="form-control-oq" id="currentPassword" name="currentPassword" type="password" maxlength="50">
        </div>
        <div class="field">
          <label for="newPassword">새 비밀번호</label>
          <input class="form-control-oq" id="newPassword" name="newPassword" type="password" minlength="4" maxlength="50">
        </div>
        <div class="field">
          <label for="newPasswordConfirm">새 비밀번호 확인</label>
          <input class="form-control-oq" id="newPasswordConfirm" name="newPasswordConfirm" type="password" minlength="4" maxlength="50">
          <div class="help">비밀번호를 변경하지 않으려면 세 칸을 모두 비워 두세요.</div>
        </div>
        <div class="button-row">
          <button class="btn-oq" type="submit">저장하기</button>
          <a class="btn-oq ghost" th:href="@{/mypage}">취소</a>
        </div>
      </form>
    </div>
  </th:block>
</th:block>
</html>
