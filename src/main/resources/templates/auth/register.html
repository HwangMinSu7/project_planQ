<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 · PLAN QUEST</title>
  <link th:href="@{/css/styles.css}" rel="stylesheet"><link th:href="@{/css/onequest.css}" rel="stylesheet">
</head>
<body class="auth-page">
  <section class="auth-card">
    <a class="brand" th:href="@{/}"><span>PLAN</span> QUEST</a>
    <h1>첫 퀘스트 준비</h1><p>간단한 정보만 입력하면 바로 시작할 수 있어요.</p>
    <div class="flash error" th:if="${error}" th:text="${error}"></div>
    <form method="post" th:action="@{/auth/register}">
      <div class="field"><label for="name">닉네임</label><input class="form-control-oq" id="name" name="name" maxlength="30" th:value="${form != null ? form.name : ''}" required></div>
      <div class="field"><label for="username">아이디</label><input class="form-control-oq account-id-input" id="username" name="username" type="text" minlength="4" maxlength="100" pattern="(?=.*[A-Za-z])(?=.*[0-9])(?:[A-Za-z0-9]+|[A-Za-z0-9]+(?:\.[A-Za-z0-9]+)*@[A-Za-z0-9]+(?:\.[A-Za-z0-9]+)+)" title="영문자와 숫자를 모두 포함하거나 이메일 형식으로 입력해 주세요." th:value="${form != null ? form.username : ''}" placeholder="예: plan123 또는 plan1@test.com" required><div class="account-id-help">영문자와 숫자를 모두 포함해 주세요. @와 .을 사용한 이메일 형식도 가능합니다.</div><div class="help">대문자와 소문자를 구분하지 않습니다.</div></div>
      <div class="field"><label for="password">비밀번호</label><input class="form-control-oq" id="password" name="password" type="password" minlength="4" required><div class="help">4자 이상 입력해 주세요.</div></div>
      <div class="field"><label for="passwordConfirm">비밀번호 확인</label><input class="form-control-oq" id="passwordConfirm" name="passwordConfirm" type="password" minlength="4" required></div>
      <button class="btn-oq" type="submit">계정 만들기</button>
    </form>
    <div class="auth-link">이미 계정이 있나요? <a th:href="@{/auth/login}">로그인</a></div>
  </section>
</body>
</html>
