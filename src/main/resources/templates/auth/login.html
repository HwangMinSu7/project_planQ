<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · PLAN QUEST</title>
  <link th:href="@{/css/styles.css}" rel="stylesheet"><link th:href="@{/css/onequest.css}" rel="stylesheet">
</head>
<body class="auth-page">
  <section class="auth-card">
    <a class="brand" th:href="@{/}"><span>PLAN</span> QUEST</a>
    <h1>다시 도전해 볼까요?</h1><p>오늘의 퀘스트가 기다리고 있어요.</p>
    <div class="flash success" th:if="${msg}" th:text="${msg}"></div>
    <div class="flash error" th:if="${param.error}">아이디 또는 비밀번호를 확인해 주세요.</div>
    <form method="post" th:action="@{/login}">
      <div class="field"><label for="username">아이디</label><input class="form-control-oq" id="username" name="username" type="text" placeholder="아이디를 입력하세요" required autofocus></div>
      <div class="field"><label for="password">비밀번호</label><input class="form-control-oq" id="password" name="password" type="password" required></div>
      <label class="help"><input type="checkbox" name="remember-me"> 7일간 로그인 유지</label>
      <button class="btn-oq" type="submit">로그인</button>
    </form>
    <div class="auth-link">처음인가요? <a th:href="@{/auth/register}">계정 만들기</a></div>
  </section>
</body>
</html>
