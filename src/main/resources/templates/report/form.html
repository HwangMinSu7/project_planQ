<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{layout/basic::setContent(~{this::content})}">
  <th:block th:fragment="content">
    <div class="form-card card">
      <div class="eyebrow">REPORT & HELP</div><h1 class="section-title">신고 또는 문의</h1>
      <p class="page-copy" style="margin-bottom:25px">운영자가 확인할 수 있도록 상황을 간단히 적어 주세요.</p>
      <form th:action="@{/reports}" method="post" th:object="${form}">
        <input type="hidden" th:field="*{targetType}"><input type="hidden" th:field="*{targetId}">
        <div class="field"><label for="kind">종류</label><select class="form-control-oq" id="kind" th:field="*{kind}"><option th:each="kind : ${kinds}" th:value="${kind}" th:text="${kind.label}"></option></select></div>
        <div class="field"><label>대상</label><input class="form-control-oq" th:value="${form.targetType.label}" readonly></div>
        <div class="field"><label for="reason">내용</label><textarea class="form-control-oq" id="reason" th:field="*{reason}" maxlength="1000" placeholder="신고 이유나 문의 내용을 입력해 주세요." required></textarea></div>
        <div class="button-row"><button class="btn-oq" type="submit">운영자에게 보내기</button><a class="btn-oq ghost" th:href="@{/community}">취소</a></div>
      </form>
    </div>
  </th:block>
</th:block>
</html>
